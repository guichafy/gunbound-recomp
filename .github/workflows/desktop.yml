name: Desktop CI and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# Serialize the WHOLE main workflow, including version calculation and builds.
# queue must be literal, and max cannot coexist with cancel-in-progress:true.
# Give each PR run its own workflow group; cancel obsolete work at job level.
concurrency:
  group: ${{ github.event_name == 'push' && 'desktop-main-releases' || format('desktop-pr-run-{0}', github.run_id) }}
  queue: max
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  SUITE_TIMEOUT: '900'

jobs:
  lint:
    name: Lint and automation tests
    concurrency:
      group: ${{ format('desktop-{0}-lint', github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            scripts
            tests
            assets/classic
            assets/hd/classic/buttons_smooth_4x
            assets/hd/classic/room_settings_4x
            assets/hd/classic/room_status_4x
            assets/xfs/jewel
            assets/xfs/hud_options_fallback
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python -m pip install -r .github/requirements-ci.txt
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/ci/release.py --title "$PR_TITLE"
      - name: Python correctness lint
        run: python -m ruff check --select E9,F63,F7,F82 scripts tests
      - name: Test automation
        run: python -m unittest discover -s tests -p 'test_ci_*.py' -v
      - name: Workflow lint
        # actionlint 1.7.12 predates GitHub's concurrency.queue. Ignore ONLY
        # that diagnostic; tests/test_ci_workflow.py validates its exact policy.
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -ignore 'unexpected key "queue" for "concurrency" section' .github/workflows/desktop.yml

  version:
    name: Calculate release version
    concurrency:
      group: ${{ format('desktop-{0}-version', github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            .github
            scripts/ci
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python scripts/ci/release.py --pr-title "$PR_TITLE"
          else
            python scripts/ci/release.py
          fi

  desktop:
    name: Test, build and smoke (${{ matrix.platform }})
    concurrency:
      group: ${{ format('desktop-{0}-desktop-{1}', github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id, matrix.platform) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: [lint, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
          - runner: windows-2022
            platform: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            assets
            locales
            scenes
            scripts
            tests
            docs/sdd
            docs/exit-restoration-preview
            docs/jewel-implementation
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python -m pip install -r .github/requirements-ci.txt
      - name: Install verified editor, templates and original test inputs
        run: python scripts/ci/bootstrap.py --no-legacy-sound
      - name: Fast cross-platform audio reproducibility checks
        env:
          PYTHONPATH: tests
        run: >-
          python -m unittest -v
          test_asate_satellite_audio.SatelliteAudio.test_import_is_reproducible
          test_client_audio_source.ClientAudio.test_reproducible_and_wrong_source_rejected_before_write
      - name: Apply the same version to both packages
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: python scripts/ci/release.py --apply "$RELEASE_VERSION"
      - name: Parse, all model/scene suites, 29 regressions + 44 map + 30 JEWEL matches and Python coverage
        run: python scripts/ci/check.py
      - name: Build and smoke extracted package outside project
        env:
          RELEASE_SHA: ${{ needs.version.outputs.sha }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: python scripts/ci/package.py --platform "$TARGET_PLATFORM" --commit "$RELEASE_SHA"
      - name: Upload tested packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}
          overwrite: true
          path: builds/dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload logs and coverage even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-${{ matrix.platform }}
          overwrite: true
          path: |
            .tools/check-logs/
            .tools/package-logs/
            .tools/coverage.xml
            .tools/coverage-html/
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Build and smoke Android candidate
    needs: [lint, version]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install emulator and screenshot observation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 libxkbcommon0 libnss3 tesseract-ocr
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Install locked Python dependencies before client bootstrap
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Verify editor and Android templates for this target
        run: python scripts/ci/bootstrap.py --target android --no-legacy-sound
      - name: Prepare exact locked SDK JDK and emulator images in the workspace
        run: python scripts/ci/android_tools.py --emulator
      - name: Apply shared version and import resources
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          python scripts/ci/release.py --apply "$RELEASE_VERSION"
          "$GODOT" --headless --path . --editor --import
      - name: Build diagnostic with isolated profile token
        run: |
          python -c 'import uuid,os;open(os.environ["GITHUB_ENV"],"a").write("ANDROID_CI_TOKEN="+uuid.uuid4().hex+"\n")'
      - name: Export diagnostic APK without production credentials
        run: python scripts/build_android.py --mode diagnostic --token "$ANDROID_CI_TOKEN" --output builds/android/diagnostic.apk
      - name: Boot API36 disposable x86_64 emulator
        run: python scripts/ci/android_tools.py --boot-api 36
      - name: Execute diagnostic APK model scene and persistence checks
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: >-
          python scripts/ci/android_ui_smoke.py --diagnostic
          --apk builds/android/diagnostic.apk --app-id com.chafy.gunboundrecomp.ci
          --token "$ANDROID_CI_TOKEN" --version "$RELEASE_VERSION"
          --output .tools/android-reports/diagnostic
      - name: Build and smoke installable test APK without distribution credentials
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ANDROID_PUBLICATION_ENABLED != 'true')
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_SHA: ${{ needs.version.outputs.sha }}
        run: |
          python scripts/build_android.py --mode candidate --output builds/android/candidate.apk
          python scripts/ci/android_ui_smoke.py --apk builds/android/candidate.apk --app-id com.chafy.gunboundrecomp.ci --version "$RELEASE_VERSION" --output .tools/android-reports/final-api36
      - name: Sign and smoke exact persistent-key APK on main only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ANDROID_PUBLICATION_ENABLED == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_SHA: ${{ needs.version.outputs.sha }}
        run: |
          export ANDROID_KEYSTORE="$RUNNER_TEMP/gunbound-release.keystore"
          trap 'rm -f "$ANDROID_KEYSTORE"' EXIT
          python -c 'import os,base64,pathlib;value=os.environ["ANDROID_KEYSTORE_BASE64"];assert value,"Persistent signing key missing; no debug fallback";p=pathlib.Path(os.environ["ANDROID_KEYSTORE"]);p.write_bytes(base64.b64decode(value,validate=True));p.chmod(0o600)'
          unset ANDROID_KEYSTORE_BASE64
          apk="builds/dist/Gunbound-Recomp-$RELEASE_VERSION-Android.apk"
          python scripts/build_android.py --mode distribution --output "$apk"
          python scripts/ci/android_ui_smoke.py --apk "$apk" --app-id com.chafy.gunboundrecomp --version "$RELEASE_VERSION" --output .tools/android-reports/final-api36
          python scripts/build_android.py --mode distribution --finalize --output "$apk" --diagnostic-report .tools/android-reports/diagnostic/report.json --ui-report .tools/android-reports/final-api36/report.json --commit "$RELEASE_SHA"
      - name: Stop API36 emulator
        if: always()
        run: '"$ADB" -s emulator-5554 emu kill || true'
      - name: Boot minimum API24 disposable x86_64 emulator
        run: python scripts/ci/android_tools.py --boot-api 24
      - name: Smoke same final APK on minimum supported API
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          ANDROID_DISTRIBUTION: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ANDROID_PUBLICATION_ENABLED == 'true' }}
        run: |
          if [[ "$ANDROID_DISTRIBUTION" == "true" ]]; then
            apk="builds/dist/Gunbound-Recomp-$RELEASE_VERSION-Android.apk"
            app=com.chafy.gunboundrecomp
          else
            apk=builds/android/candidate.apk
            app=com.chafy.gunboundrecomp.ci
          fi
          python scripts/ci/android_ui_smoke.py --apk "$apk" --app-id "$app" --version "$RELEASE_VERSION" --output .tools/android-reports/final-api24
      - name: Stop disposable emulator
        if: always()
        run: '"$ADB" -s emulator-5554 emu kill || true'
      - name: Upload signed main package before human approval
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ANDROID_PUBLICATION_ENABLED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-package
          path: |
            builds/dist/*.apk
            builds/dist/*-Android.json
            builds/dist/*.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Collect smoke reports for the GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ANDROID_PUBLICATION_ENABLED != 'true'
        run: |
          cp .tools/android-reports/final-api24/report.json builds/android/smoke-api24.json
          cp .tools/android-reports/final-api36/report.json builds/android/smoke-api36.json
      - name: Upload installable test APKs for PR and main
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ANDROID_PUBLICATION_ENABLED != 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-candidates-not-for-distribution
          path: |
            builds/android/*.apk
            builds/android/candidate.inspection.json
            builds/android/smoke-api*.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Android evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-evidence
          path: |
            .tools/android-reports/
            .tools/android/emulator-*.log
            builds/android/*.inspection.json
            builds/dist/*.inspection.json
          if-no-files-found: warn
          retention-days: 14

  android-acceptance:
    name: Verify trusted physical ARM64 acceptance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ANDROID_PUBLICATION_ENABLED == 'true'
    needs: [version, android]
    environment: android-device-acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-package
          path: android-package
      - name: Reconcile structured approval with GitHub review history
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_TRUSTED_REVIEWERS: ${{ vars.ANDROID_TRUSTED_REVIEWERS }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: python scripts/ci/android_acceptance.py --manifest "android-package/Gunbound-Recomp-$RELEASE_VERSION-Android.json" --output acceptance/android-acceptance.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-acceptance
          path: acceptance/android-acceptance.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish verified GitHub release
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.version.result == 'success' && needs.desktop.result == 'success' && needs.android.result == 'success' &&
      ((vars.ANDROID_PUBLICATION_ENABLED == 'true' && needs.android-acceptance.result == 'success') ||
       (vars.ANDROID_PUBLICATION_ENABLED != 'true' && needs.android-acceptance.result == 'skipped'))
    needs: [version, desktop, android, android-acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            scripts/ci
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: vars.ANDROID_PUBLICATION_ENABLED == 'true'
        with:
          name: android-package
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: vars.ANDROID_PUBLICATION_ENABLED == 'true'
        with:
          name: android-acceptance
          path: acceptance
      - name: Download tested Android candidate
        if: vars.ANDROID_PUBLICATION_ENABLED != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-test-candidates-not-for-distribution
          path: test-candidate
      - name: Publish desktop ZIPs and the test APK
        if: vars.ANDROID_PUBLICATION_ENABLED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_SHA: ${{ needs.version.outputs.sha }}
        run: python scripts/ci/publish.py --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --test-candidate test-candidate
      - name: Verify manifests and publish draft only after all uploads
        if: vars.ANDROID_PUBLICATION_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_TRUSTED_REVIEWERS: ${{ vars.ANDROID_TRUSTED_REVIEWERS }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_SHA: ${{ needs.version.outputs.sha }}
        run: python scripts/ci/publish.py --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --acceptance acceptance/android-acceptance.json
